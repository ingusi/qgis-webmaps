<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QGIS Web Maps</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ==============================
         HEADER
    =============================== -->
    <header class="site-header">

        <div class="header-content">

            <div class="logo">
                <span class="logo-icon">🌍</span>

                <div>
                    <h1>QGIS Web Maps</h1>
                    <p>Interactive Geospatial Data</p>
                </div>
            </div>

        </div>

    </header>


    <!-- ==============================
         NAVIGATION
    =============================== -->
    <nav class="map-navigation">

        <button
            class="map-button active"
            data-map="submarinecable">

            1. Submarine Cable

        </button>

        <button
            class="map-button"
            data-map="mndwi">

            2. Landsat / Sentinel MNDWI

        </button>

        <button
            class="map-button"
            data-map="wind-solar">

            3. Wind / Solar

        </button>

    </nav>


    <!-- ==============================
         MAIN CONTENT
    =============================== -->
    <main class="main-content">

        <!-- Titel -->
        <section class="map-introduction">

            <h2 id="map-title">
                Submarine Cable
            </h2>

            <p id="map-description">
                Interactive map showing submarine cable infrastructure
                and related geographic information.
            </p>

        </section>


        <!-- Zusatzfunktionen -->
        <section class="map-tools">

            <button
                id="legend-button"
                class="tool-button">

                🗺️ Legend

            </button>

            <button
                id="chart-button"
                class="tool-button">

                📊 Charts

            </button>

        </section>


        <!-- ==============================
             LEGEND
        =============================== -->
        <section
            id="legend-panel"
            class="overlay-panel hidden">

            <div class="panel-header">

                <h3>Legend</h3>

                <button
                    id="close-legend"
                    class="close-button">

                    ×

                </button>

            </div>

            <div class="panel-content">

                <img
                    id="legend-image"
                    src="assets/legends/submarinecable.png"
                    alt="Map legend">

            </div>

        </section>


        <!-- ==============================
             CHARTS
        =============================== -->
        <section
            id="chart-panel"
            class="overlay-panel hidden">

            <div class="panel-header">

                <h3>Charts</h3>

                <button
                    id="close-chart"
                    class="close-button">

                    ×

                </button>

            </div>

            <div
                id="chart-container"
                class="panel-content">

                <!-- Charts werden per JavaScript erzeugt -->

            </div>

        </section>


        <!-- ==============================
             MAP
        =============================== -->
        <section class="map-container">

            <iframe
                id="map-frame"
                src="maps/submarinecable/index.html"
                title="Interactive QGIS map"
                loading="lazy">
            </iframe>

        </section>

    </main>


    <!-- ==============================
         FOOTER
    =============================== -->
    <footer class="site-footer">

        <p>
            Interactive maps created with QGIS and qgis2web.
        </p>

    </footer>


    <!-- Chart.js -->
    <script
        src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>

    <!-- Eigener JavaScript-Code -->
    <script src="js/app.js"></script>

</body>
</html>
